<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Art | boxyourbuddy</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; background: #111; color: #fff; padding: 48px 20px 80px; }
        .container { max-width: 660px; margin: 0 auto; }

        .tool-header { margin-bottom: 40px; }
        .tool-header h1 { font-size: 1rem; letter-spacing: 4px; text-transform: uppercase; color: #FFF0AD; margin: 0 0 6px; }
        .tool-header p { font-size: 0.8rem; color: #555; margin: 0; letter-spacing: 1px; }

        .field { margin-bottom: 28px; }
        label {
            display: block;
            font-size: 0.65rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .hint { font-size: 0.7rem; color: #444; margin-top: 6px; letter-spacing: 0.5px; font-weight: normal; }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            background: #000;
            border: 1px solid #2a2a2a;
            color: #fff;
            padding: 12px 14px;
            font-size: 1rem;
            border-radius: 4px;
            outline: none;
            font-family: Arial, sans-serif;
        }
        input[type="password"]:focus,
        input[type="text"]:focus { border-color: #FFF0AD; }

        .divider { border: 0; border-top: 1px solid #1a1a1a; margin: 32px 0; }

        /* Section headings */
        .section-label {
            font-size: 0.65rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #666;
            margin: 0 0 16px;
            font-weight: bold;
        }

        /* Current art grid */
        .art-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }
        .art-item { position: relative; }
        .art-item img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 4px;
            display: block;
            background: #000;
        }
        .art-item .del-btn {
            position: absolute;
            top: 5px; right: 5px;
            background: rgba(0,0,0,0.75);
            border: 1px solid #444;
            color: #aaa;
            font-size: 0.65rem;
            padding: 3px 7px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            font-family: Arial, sans-serif;
            transition: background 0.15s, color 0.15s;
        }
        .art-item .del-btn:hover { background: #c0392b; border-color: #c0392b; color: #fff; }
        .art-item .fname {
            font-size: 0.6rem;
            color: #444;
            margin-top: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.5px;
        }

        .art-placeholder {
            font-size: 0.8rem;
            color: #444;
            letter-spacing: 1px;
            font-weight: normal;
        }

        .load-btn {
            background: none;
            border: 1px solid #2a2a2a;
            color: #888;
            padding: 8px 18px;
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            transition: border-color 0.15s, color 0.15s;
            margin-bottom: 16px;
        }
        .load-btn:hover { border-color: #FFF0AD; color: #FFF0AD; }
        .load-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Upload area */
        .upload-area {
            border: 1px dashed #333;
            border-radius: 4px;
            padding: 32px 24px;
            text-align: center;
            cursor: pointer;
            background: #000;
            transition: border-color 0.2s;
        }
        .upload-area:hover,
        .upload-area.drag-over { border-color: #FFF0AD; background: #0a0a0a; }
        .upload-area p { margin: 0 0 4px; font-size: 0.85rem; color: #666; letter-spacing: 1px; }
        .upload-area span { font-size: 0.7rem; color: #333; letter-spacing: 1px; }

        /* Upload preview grid */
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 14px;
        }
        .preview-item { position: relative; }
        .preview-item img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 4px;
            display: block;
        }
        .preview-item .remove {
            position: absolute;
            top: 4px; right: 4px;
            background: rgba(0,0,0,0.7);
            border: none;
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }
        .preview-item .remove:hover { background: #ff4444; }
        .preview-item input[type="text"] { padding: 6px 8px; font-size: 0.8rem; margin-top: 6px; }
        .preview-item .fname {
            font-size: 0.6rem;
            color: #444;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.5px;
        }

        /* Buttons */
        .add-btn {
            background: #FFF0AD;
            color: #000;
            border: none;
            padding: 14px 36px;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            transition: background 0.15s;
        }
        .add-btn:hover { background: #fff; }
        .add-btn:disabled { background: #333; color: #555; cursor: not-allowed; }

        /* Log */
        .log {
            margin-top: 24px;
            background: #000;
            border: 1px solid #1a1a1a;
            border-radius: 4px;
            padding: 16px;
            display: none;
        }
        .log-line {
            font-size: 0.75rem;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: normal;
        }
        .log-line:last-child { margin-bottom: 0; }
        .log-line.ok   { color: #7fff7f; }
        .log-line.err  { color: #ff6b6b; }
        .log-line.info { color: #888; }
        .log-line.done { color: #FFF0AD; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">

    <div class="tool-header">
        <h1>Art Manager</h1>
        <p>Add or remove art from the gallery.</p>
    </div>

    <!-- Token -->
    <div class="field">
        <label>GitHub Personal Access Token</label>
        <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off">
        <p class="hint">Saved in your browser. Needs <strong>repo</strong> scope. <a href="https://github.com/settings/tokens/new?scopes=repo&description=BoxYourBuddy+art+uploader" target="_blank" style="color:#FFF0AD;">Generate one here ↗</a></p>
    </div>

    <hr class="divider">

    <!-- Current art -->
    <div class="field">
        <p class="section-label">Current Art in Gallery</p>
        <button class="load-btn" id="loadBtn" onclick="loadCurrentArt()">Load Current Art</button>
        <div class="art-grid" id="artGrid">
            <p class="art-placeholder">Click above to load.</p>
        </div>
    </div>

    <hr class="divider">

    <!-- Add photos -->
    <div class="field">
        <label>Add Photos</label>
        <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <p>Click or drag photos here</p>
            <span>JPG, PNG, GIF, WEBP</span>
        </div>
        <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
        <div class="preview-grid" id="previewGrid"></div>
    </div>

    <button class="add-btn" id="addBtn" onclick="runUpload()">Add to Art Page</button>

    <div class="log" id="log"></div>

</div>

<script>
    // ─── Constants ────────────────────────────────────────────────────────────
    const REPO   = 'boxyourbuddy/boxyourbuddy.github.io';
    const BRANCH = 'main';
    const API    = 'https://api.github.com';
    const RAW    = `https://raw.githubusercontent.com/${REPO}/${BRANCH}`;

    // ─── Token ────────────────────────────────────────────────────────────────
    const tokenInput = document.getElementById('token');
    tokenInput.value = localStorage.getItem('byb_gh_token') || '';
    tokenInput.addEventListener('change', () => {
        localStorage.setItem('byb_gh_token', tokenInput.value.trim());
    });

    function getToken() {
        const t = tokenInput.value.trim();
        localStorage.setItem('byb_gh_token', t);
        return t;
    }

    // ─── GitHub API helpers ───────────────────────────────────────────────────
    async function ghGet(token, path) {
        const res = await fetch(`${API}/repos/${REPO}/contents/${path}?ref=${BRANCH}`, {
            headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github+json' }
        });
        if (!res.ok) throw new Error(`GET ${path} → ${res.status}`);
        return res.json();
    }

    async function ghPut(token, path, content64, message, sha) {
        const body = { message, content: content64, branch: BRANCH };
        if (sha) body.sha = sha;
        const res = await fetch(`${API}/repos/${REPO}/contents/${path}`, {
            method: 'PUT',
            headers: {
                Authorization: `token ${token}`,
                Accept: 'application/vnd.github+json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
        });
        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(`PUT ${path} → ${res.status}: ${err.message || ''}`);
        }
        return res.json();
    }

    async function ghDelete(token, path, sha, message) {
        const res = await fetch(`${API}/repos/${REPO}/contents/${path}`, {
            method: 'DELETE',
            headers: {
                Authorization: `token ${token}`,
                Accept: 'application/vnd.github+json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ message, sha, branch: BRANCH })
        });
        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(`DELETE ${path} → ${res.status}: ${err.message || ''}`);
        }
        return res.json();
    }

    // ─── Encoding helpers ─────────────────────────────────────────────────────
    function b64Decode(str) {
        return decodeURIComponent(
            atob(str.replace(/\n/g, '')).split('').map(c =>
                '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
            ).join('')
        );
    }

    function b64Encode(str) {
        return btoa(
            encodeURIComponent(str).replace(/%([0-9A-F]{2})/gi, (_, p1) =>
                String.fromCharCode(parseInt(p1, 16))
            )
        );
    }

    function readFileAsBase64(file) {
        return new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = e => res(e.target.result.split(',')[1]);
            r.onerror = rej;
            r.readAsDataURL(file);
        });
    }

    // Resize to max 720px wide, output as JPEG base64
    function resizeAndEncode(file) {
        return new Promise((res, rej) => {
            const reader = new FileReader();
            reader.onerror = rej;
            reader.onload = ev => {
                const img = new Image();
                img.onerror = rej;
                img.onload = () => {
                    const MAX = 720;
                    let w = img.width;
                    let h = img.height;
                    if (w > MAX) {
                        h = Math.round(h * MAX / w);
                        w = MAX;
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    res({ base64: canvas.toDataURL('image/jpeg', 0.88).split(',')[1], w, h });
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    function slugifyFilename(name) {
        const ext = name.split('.').pop().toLowerCase();
        const base = name.slice(0, name.lastIndexOf('.'))
            .toLowerCase()
            .replace(/[^a-z0-9\s-]/g, '')
            .trim()
            .replace(/\s+/g, '-')
            .replace(/-+/g, '-');
        return `${base}.${ext}`;
    }

    // ─── Log ──────────────────────────────────────────────────────────────────
    const logEl = document.getElementById('log');

    function logClear() { logEl.innerHTML = ''; logEl.style.display = 'none'; }

    function logLine(msg, type = 'info') {
        logEl.style.display = 'block';
        const div = document.createElement('div');
        div.className = `log-line ${type}`;
        div.textContent = msg;
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
    }

    // ─── Current art loader ───────────────────────────────────────────────────
    // ─── Picture list helpers ─────────────────────────────────────────────
    function escAttr(str) {
        return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function slugifyTitle(t) {
        return t.toLowerCase().replace(/'/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    }

    function prettyTitle(filename) {
        return filename.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').trim().replace(/\b[a-z]/g, c => c.toUpperCase());
    }

    // Previous and Next follow alphabetical order by title
    function sortList(list) {
        return list.slice().sort((a, b) => {
            const x = a.title.toLowerCase(), y = b.title.toLowerCase();
            return x < y ? -1 : x > y ? 1 : 0;
        });
    }

    async function readList(token) {
        const f = await ghGet(token, 'art/pictures.json');
        return { sha: f.sha, list: JSON.parse(b64Decode(f.content)) };
    }

    function listContent(list) {
        return b64Encode(JSON.stringify(list, null, 2) + '\n');
    }

    function pageHtml(title, slug, filename, prevSlug, nextSlug) {
        const t = escAttr(title);
        return `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${t} | boxyourbuddy</title>
    <meta name="description" content="${t}, original art by boxyourbuddy.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="boxyourbuddy">
    <meta property="og:title" content="${t} | boxyourbuddy">
    <meta property="og:description" content="${t}, original art by boxyourbuddy.">
    <meta property="og:url" content="https://boxyourbuddy.com/art/${slug}/">
    <meta property="og:image" content="https://boxyourbuddy.com/art/${filename}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="${t} | boxyourbuddy">
    <meta name="twitter:description" content="${t}, original art by boxyourbuddy.">
    <meta name="twitter:image" content="https://boxyourbuddy.com/art/${filename}">
    <link rel="icon" href="/favicon.png" type="image/png">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7NDGQGQM5G"><\/script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-7NDGQGQM5G');
    <\/script>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; font-weight: bold; }
        body { margin: 0; background: #000; color: #fff; overflow-x: hidden; }
        .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 60px 20px; }
        .page-header { text-align: center; margin-bottom: 40px; width: 100%; }
        .brand-wrap { display: flex; align-items: center; justify-content: center; gap: 14px; }
        .brand-logo { width: 50px; height: auto; }
        .brand-name { letter-spacing: 2px; margin: 0; font-size: clamp(1.5rem, 5vw, 2.8rem); text-transform: uppercase; }
        .brand-name .tint { color: #FFF0AD; }
        .nav { margin-top: 16px; display: flex; gap: 20px; justify-content: center; align-items: center; flex-wrap: wrap; }
        .nav a { font-size: 0.75rem; letter-spacing: 4px; color: #888; text-decoration: none; text-transform: uppercase; }
        .nav a:hover { color: #FFF0AD; }
        .nav .dot { height: 15px; width: 15px; display: inline-block; vertical-align: middle; }
        .frame { width: fit-content; max-width: min(100%, 1000px); }
        .frame img { display: block; max-width: 100%; width: auto; height: auto; }
        .art-title { font-size: clamp(1.5rem, 4vw, 2.2rem); letter-spacing: 1px; margin: 24px 0 0; }
        .story-end { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px 24px; margin-top: 32px; padding-top: 24px; border-top: 1px solid #222; }
        .story-end .side { display: flex; flex-wrap: wrap; gap: 16px 24px; }
        .story-end a, .story-end button { font-family: Arial, sans-serif; font-size: 0.75rem; letter-spacing: 3px; color: #888; text-decoration: none; text-transform: uppercase; font-weight: bold; background: none; border: 0; padding: 0; cursor: pointer; }
        .story-end a:hover, .story-end button:hover { color: #FFF0AD; }
    </style>
</head>
<body>
    <div class="page">
        <header class="page-header">
            <div class="brand-wrap">
                <img src="/images/box-small.png" alt="boxyourbuddy logo" class="brand-logo">
                <h1 class="brand-name"><span class="tint">B</span>OX<span class="tint">Y</span>OUR<span class="tint">B</span>UDDY</h1>
            </div>
            <nav class="nav">
                <a href="/">HOME</a>
                <img src="/favicon.png" class="dot" alt="">
                <a href="/writing/">WRITING</a>
                <img src="/favicon.png" class="dot" alt="">
                <a href="/art/" style="color: #FFF0AD;">ART</a>
                <img src="/favicon.png" class="dot" alt="">
                <a href="/apps/">APPS</a>
                <img src="/favicon.png" class="dot" alt="">
                <a href="/games/">GAMES</a>
            </nav>
        </header>

        <div class="frame">
            <img src="/art/${filename}" alt="${t}">
            <h2 class="art-title">${t}</h2>

            <div class="story-end">
                <div class="side">
                    <a href="/art/">&larr; Back to gallery</a>
                    <button type="button" id="share-link">Share</button>
                </div>
                <div class="side">
                    <a href="/art/${prevSlug}/" id="prev-art">&larr; Previous</a>
                    <a href="/art/${nextSlug}/" id="next-art">Next &rarr;</a>
                </div>
            </div>
        </div>
    </div>
<script>
(function () {
    var b = document.getElementById('share-link');
    if (!b) return;
    b.addEventListener('click', function () {
        var url = window.location.origin + window.location.pathname;
        function done() { b.textContent = 'Link copied'; setTimeout(function () { b.textContent = 'Share'; }, 2000); }
        function fallback(t) {
            var a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0';
            document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(a);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(done, function () { fallback(url); done(); });
        } else { fallback(url); done(); }
    });
})();
(function () {
    var prev = document.getElementById('prev-art'), next = document.getElementById('next-art');
    if (!prev || !next) return;
    fetch('/art/pictures.json').then(function (r) { return r.json(); }).then(function (list) {
        list = list.slice().sort(function (a, b) { var x = a.title.toLowerCase(), y = b.title.toLowerCase(); return x < y ? -1 : x > y ? 1 : 0; });
        var here = window.location.pathname.split('/').filter(function (p) { return p && p !== 'index.html'; }).pop();
        var i = list.findIndex(function (p) { return p.slug === here; });
        if (i < 0 || list.length < 2) return;
        prev.href = '/art/' + list[(i - 1 + list.length) % list.length].slug + '/';
        next.href = '/art/' + list[(i + 1) % list.length].slug + '/';
    }).catch(function () {});
})();
<\/script>
</body>
</html>
`;
    }

    async function sitemapAdd(token, locs) {
        const f = await ghGet(token, 'sitemap.xml');
        let xml = b64Decode(f.content), changed = false;
        locs.forEach(loc => {
            if (xml.includes(`<loc>${loc}</loc>`)) return;
            xml = xml.replace('</urlset>', `  <url>\n    <loc>${loc}</loc>\n    <priority>0.5</priority>\n    <changefreq>yearly</changefreq>\n  </url>\n\n</urlset>`);
            changed = true;
        });
        if (changed) await ghPut(token, 'sitemap.xml', b64Encode(xml), 'Add art pages to sitemap', f.sha);
        return changed;
    }

    async function sitemapRemove(token, loc) {
        const f = await ghGet(token, 'sitemap.xml');
        let xml = b64Decode(f.content);
        const at = xml.indexOf(`<loc>${loc}</loc>`);
        if (at < 0) return false;
        const start = xml.lastIndexOf('  <url>', at);
        let end = xml.indexOf('</url>', at) + '</url>'.length;
        while (xml[end] === '\n') end++;
        xml = xml.slice(0, start) + xml.slice(end);
        await ghPut(token, 'sitemap.xml', b64Encode(xml), 'Remove art page from sitemap', f.sha);
        return true;
    }

    // ─── Load current art ─────────────────────────────────────────────────
    async function loadCurrentArt() {
        const token = getToken();
        if (!token) { alert('Please enter your GitHub token first.'); return; }

        const btn = document.getElementById('loadBtn');
        const grid = document.getElementById('artGrid');
        btn.disabled = true;
        btn.textContent = 'Loading…';
        grid.innerHTML = '';

        try {
            const { list } = await readList(token);

            if (list.length === 0) {
                grid.innerHTML = '<p class="art-placeholder">No art in the gallery yet.</p>';
                return;
            }

            sortList(list).forEach(p => {
                const item = document.createElement('div');
                item.className = 'art-item';
                item.innerHTML = `
                    <img src="${RAW}/art/${p.src}?t=${Date.now()}" alt="${escAttr(p.title)}">
                    <button class="del-btn" onclick="deleteArt('${p.src}', this)">DELETE</button>
                    <div class="fname">${escAttr(p.title)}</div>
                `;
                grid.appendChild(item);
            });

        } catch (err) {
            grid.innerHTML = `<p class="art-placeholder" style="color:#ff6b6b;">Error: ${err.message}</p>`;
        } finally {
            btn.disabled = false;
            btn.textContent = 'Refresh';
        }
    }

    // ─── Delete art ─────────────────────────────────────────────────────────
    async function deleteArt(filename, btnEl) {
        if (!confirm(`Are you sure you want to delete "${filename}"?\n\nThis will remove it from the gallery and delete its picture and its page.`)) return;

        const token = getToken();
        if (!token) { alert('Please enter your GitHub token first.'); return; }

        btnEl.disabled = true;
        btnEl.textContent = '…';
        logClear();

        try {
            logLine('Reading the picture list…');
            const cur = await readList(token);
            const entry = cur.list.find(p => p.src === filename);
            if (!entry) throw new Error(`Could not find "${filename}" in the picture list`);

            logLine('Updating the picture list…');
            await ghPut(token, 'art/pictures.json', listContent(cur.list.filter(p => p.src !== filename)),
                `Remove art: ${filename}`, cur.sha);
            logLine('  ✓ removed from the gallery', 'ok');

            logLine(`Deleting art/${entry.slug}/index.html…`);
            try {
                const pageFile = await ghGet(token, `art/${entry.slug}/index.html`);
                await ghDelete(token, `art/${entry.slug}/index.html`, pageFile.sha, `Delete art page: ${entry.title}`);
                logLine('  ✓ page deleted', 'ok');
            } catch (e) { logLine(`  could not delete the page: ${e.message}`, 'err'); }

            logLine(`Deleting art/${filename}…`);
            const imgFile = await ghGet(token, `art/${filename}`);
            await ghDelete(token, `art/${filename}`, imgFile.sha, `Delete art image: ${filename}`);
            logLine('  ✓ image deleted', 'ok');

            try {
                logLine('Updating sitemap.xml…');
                await sitemapRemove(token, `https://boxyourbuddy.com/art/${entry.slug}/`);
                logLine('  ✓ updated', 'ok');
            } catch (e) { logLine(`  could not update sitemap.xml: ${e.message}`, 'err'); }

            logLine(`✓ Done - "${entry.title}" removed. Changes are live on GitHub.`, 'done');

            btnEl.closest('.art-item').remove();

        } catch (err) {
            logLine(`Error: ${err.message}`, 'err');
            console.error(err);
            btnEl.disabled = false;
            btnEl.textContent = 'DELETE';
        }
    }

    // ─── Upload new art ───────────────────────────────────────────────────────
    let selectedFiles = [];

    document.getElementById('fileInput').addEventListener('change', function (e) {
        addFiles(e.target.files);
        this.value = '';
    });

    const uploadArea = document.getElementById('uploadArea');
    uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('drag-over'); });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag-over'));
    uploadArea.addEventListener('drop', e => {
        e.preventDefault();
        uploadArea.classList.remove('drag-over');
        addFiles(e.dataTransfer.files);
    });

    function addFiles(files) {
        for (const file of files) {
            if (!file.type.startsWith('image/')) continue;
            selectedFiles.push({ file, objectUrl: URL.createObjectURL(file), title: prettyTitle(file.name) });
        }
        renderPreviews();
    }

    function renderPreviews() {
        const grid = document.getElementById('previewGrid');
        grid.innerHTML = '';
        selectedFiles.forEach((item, i) => {
            const div = document.createElement('div');
            div.className = 'preview-item';
            div.innerHTML = `
                <img src="${item.objectUrl}" alt="">
                <button class="remove" onclick="removeFile(${i})">✕</button>
                <div class="fname">${item.file.name}</div>
                <input type="text" placeholder="Title" value="${escAttr(item.title)}" oninput="selectedFiles[${i}].title = this.value">
            `;
            grid.appendChild(div);
        });
    }

    function removeFile(i) {
        URL.revokeObjectURL(selectedFiles[i].objectUrl);
        selectedFiles.splice(i, 1);
        renderPreviews();
    }

    async function runUpload() {
        const token = getToken();
        if (!token) { alert('Please enter your GitHub token.'); return; }
        if (selectedFiles.length === 0) { alert('Please choose at least one photo.'); return; }

        const btn = document.getElementById('addBtn');
        btn.disabled = true;
        logClear();

        try {
            logLine('Reading the picture list…');
            const cur = await readList(token);
            let list = cur.list.slice();
            const added = [];

            for (const item of selectedFiles) {
                const title = (item.title || '').trim() || prettyTitle(item.file.name);
                const slug = slugifyTitle(title);
                if (!slug) throw new Error(`"${title}" is not a usable title.`);

                // Always output as .jpg after canvas resize
                const base = slugifyFilename(item.file.name).replace(/\.[^.]+$/, '');
                const filename = `${base}.jpg`;
                const clash = list.find(p => p.slug === slug && p.src !== filename);
                if (clash) throw new Error(`A piece titled "${clash.title}" already exists. Choose a different title.`);

                logLine(`Resizing & uploading ${filename}…`);
                let existingSha = null;
                try {
                    const existing = await ghGet(token, `art/${filename}`);
                    existingSha = existing.sha;
                    logLine('  already exists - overwriting', 'info');
                } catch (e) { /* new file */ }

                const enc = await resizeAndEncode(item.file);
                await ghPut(token, `art/${filename}`, enc.base64, `Add art: ${filename}`, existingSha);
                logLine('  ✓ uploaded', 'ok');

                list = list.filter(p => p.src !== filename);
                list.push({ src: filename, w: enc.w, h: enc.h, title, slug });
                added.push({ title, slug, filename });
            }

            // Pages first, so the gallery never lists a picture without its page
            const sorted = sortList(list);
            for (const a of added) {
                const i = sorted.findIndex(p => p.slug === a.slug);
                const prevSlug = sorted[(i - 1 + sorted.length) % sorted.length].slug;
                const nextSlug = sorted[(i + 1) % sorted.length].slug;
                logLine(`Creating art/${a.slug}/index.html…`);
                let pageSha = null;
                try { pageSha = (await ghGet(token, `art/${a.slug}/index.html`)).sha; } catch (e) { /* new page */ }
                await ghPut(token, `art/${a.slug}/index.html`, b64Encode(pageHtml(a.title, a.slug, a.filename, prevSlug, nextSlug)),
                    `Add art page: ${a.title}`, pageSha);
                logLine('  ✓ page created', 'ok');
            }

            logLine('Updating the picture list…');
            await ghPut(token, 'art/pictures.json', listContent(list),
                `Add ${added.length} piece${added.length > 1 ? 's' : ''} to the art gallery`, cur.sha);
            logLine('  ✓ updated', 'ok');

            try {
                logLine('Updating sitemap.xml…');
                await sitemapAdd(token, added.map(a => `https://boxyourbuddy.com/art/${a.slug}/`));
                logLine('  ✓ updated', 'ok');
            } catch (e) { logLine(`  could not update sitemap.xml: ${e.message}`, 'err'); }

            logLine(`✓ Done - ${added.length} piece${added.length > 1 ? 's' : ''} added. Changes are live on GitHub.`, 'done');

            selectedFiles.forEach(f => URL.revokeObjectURL(f.objectUrl));
            selectedFiles = [];
            renderPreviews();

            // Reload the art grid
            loadCurrentArt();

        } catch (err) {
            logLine(`Error: ${err.message}`, 'err');
            console.error(err);
        } finally {
            btn.disabled = false;
        }
    }

    // Auto-load if token already saved
    if (tokenInput.value) loadCurrentArt();
</script>
</body>
</html>
