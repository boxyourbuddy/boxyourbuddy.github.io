    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; font-weight: bold; }
        body { margin: 0; background: #000; color: #fff; overflow-x: hidden; }
        .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 60px 20px; }
        .page-header { text-align: center; margin-bottom: 40px; width: 100%; }
        .brand-wrap { display: flex; align-items: center; justify-content: center; gap: 14px; }
        .brand-logo { width: 50px; height: auto; }

        .nav { margin-top: 16px; display: flex; gap: 20px; justify-content: center; align-items: center; flex-wrap: wrap; }

        .story-end a:hover, .story-end button:hover { color: #FFF0AD; }

<body>
    <div class="page">
        <header class="page-header">
            <div class="brand-wrap">
                <img src="/images/box-small.png" alt="boxyourbuddy logo" class="brand-logo">
                <h1 class="brand-name"><span class="tint">B</span>OX<span class="tint">Y</span>OUR<span class="tint">B</span>UDDY</h1>
            </div>
            <nav class="nav">

                <img src="/favicon.png" class="dot" alt="">
                <a href="/writing/">WRITING</a>
                <img src="/favicon.png" class="dot" alt="">
                <a href="/art/" style="color: #FFF0AD;">ART</a>

                <a href="/apps/">APPS</a>
                <img src="/favicon.png" class="dot" alt="">
                <a href="/games/">GAMES</a>
            </nav>
        </header>

        <div class="frame">
            <img src="/art/green21200.jpg" alt="Green 2">
            <h2 class="art-title">Green 2</h2>

            <div class="story-end">
                <div class="side">
                    <a href="/art/">&larr; Back to gallery</a>
                    <button type="button" id="share-link">Share</button>
                </div>
                <div class="side">
                    <a href="/art/free/" id="prev-art">&larr; Previous</a>
                    <a href="/art/im-out-of-control/" id="next-art">Next &rarr;</a>
                </div>
            </div>
        </div>
    </div>
<script>
(function () {
    var b = document.getElementById('share-link');
    if (!b) return;
    b.addEventListener('click', function () {
        var url = window.location.origin + window.location.pathname;
        function done() { b.textContent = 'Link copied'; setTimeout(function () { b.textContent = 'Share'; }, 2000); }
        function fallback(t) {
            var a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0';
            document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(a);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(done, function () { fallback(url); done(); });
        } else { fallback(url); done(); }
    });
})();
(function () {
    var prev = document.getElementById('prev-art'), next = document.getElementById('next-art');
    if (!prev || !next) return;
    fetch('/art/pictures.json').then(function (r) { return r.json(); }).then(function (list) {
        list = list.slice().sort(function (a, b) { var x = a.title.toLowerCase(), y = b.title.toLowerCase(); return x < y ? -1 : x > y ? 1 : 0; });
        var here = window.location.pathname.split('/').filter(function (p) { return p && p !== 'index.html'; }).pop();
        var i = list.findIndex(function (p) { return p.slug === here; });
        if (i < 0 || list.length < 2) return;
        prev.href = '/art/' + list[(i - 1 + list.length) % list.length].slug + '/';
        next.href = '/art/' + list[(i + 1) % list.length].slug + '/';
    }).catch(function () {});
})();
</script>
