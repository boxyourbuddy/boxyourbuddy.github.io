    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; font-weight: bold; }
        body { margin: 0; background: #000; color: #fff; overflow-x: hidden; }
        .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 60px 20px; }

        .slideshow { width: 100%; max-width: 720px; cursor: default; }
        .slide { display: none; }
        .slide.active { display: block; animation: fadeIn 0.6s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .slide img { width: 100%; height: auto; display: block; }
    </style>

            <!-- SLIDES -->
        </div>

    <script>
        (function () {
            var slides = Array.from(document.querySelectorAll('.slide'));
            if (slides.length < 2) return;
            var current = 0;
            var timer = null;

            function showSlide(n) {
                slides[current].classList.remove('active');
                current = (n + slides.length) % slides.length;
                slides[current].classList.add('active');
            }

            function next() { showSlide(current + 1); }

            function startTimer() {
                clearInterval(timer);
                timer = setInterval(next, 5000);
            }

            var ss = document.getElementById('slideshow');
            ss.addEventListener('mouseenter', function () { clearInterval(timer); });
            ss.addEventListener('mouseleave', startTimer);

            startTimer();
        })();
    </script>
