<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earth Solo Only Player Stats</title>

<style>
  :root{
    --bg:#000000; --surface:#1A1A1A; --surface-2:#242424;
    --text:#FFFFFF; --text-muted:#A0A0A0; --border:#333333;
    --accent:#D97F3D; --accent-soft:#3D2A1A;
    --font-body: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-body);
    margin:0; line-height:1.55; font-size:16px;
  }
  .wrap{ max-width:1400px; margin:0 auto; padding:2.5rem 1.5rem 6rem; }

  header.hero{ border-bottom:1px solid var(--border); padding-bottom:1.5rem; margin-bottom:1.5rem; }
  .eyebrow{
    font-family:var(--font-mono); font-size:0.72rem; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--accent); font-weight:700; margin-bottom:0.6rem;
  }
  h1{
    font-size:clamp(1.9rem, 4vw, 2.7rem); font-weight:800; letter-spacing:-0.01em;
    font-stretch:condensed; margin:0 0 0.5rem;
  }
  .sub{ color:var(--text-muted); font-size:0.92rem; max-width:60ch; margin:0; }
  .back{ color:var(--text-muted); font-size:0.85rem; text-decoration:none; }
  .back:hover{ color:var(--text); }

  .controls{ display:flex; flex-wrap:wrap; gap:0.75rem; align-items:center; margin-bottom:1.25rem; }
  .controls input, .controls select{
    background:var(--surface); color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:0.5rem 0.7rem; font-size:0.9rem; font-family:inherit;
  }
  .controls input{ min-width:220px; }
  .controls input:focus, .controls select:focus{ outline:none; border-color:var(--accent); }
  .count{ color:var(--text-muted); font-size:0.85rem; margin-left:auto; font-family:var(--font-mono); }

  nav.tabs{
    display:flex; flex-wrap:wrap; gap:0.15rem; border-bottom:1px solid var(--border); margin-bottom:1.25rem;
  }
  nav.tabs button{
    background:none; border:none; border-bottom:2px solid transparent; color:var(--text-muted);
    font-family:var(--font-mono); font-size:0.74rem; letter-spacing:0.09em; text-transform:uppercase;
    font-weight:700; padding:0.7rem 0.85rem; cursor:pointer;
  }
  nav.tabs button:hover{ color:var(--text); }
  nav.tabs button[aria-selected="true"]{ color:var(--accent); border-bottom-color:var(--accent); }

  .table-scroll{ overflow-x:auto; border:1px solid var(--border); border-radius:12px; background:var(--surface); }
  table{ border-collapse:collapse; width:100%; font-size:0.9rem; }
  th, td{ padding:0.6rem 0.85rem; text-align:right; white-space:nowrap; }
  th:first-child, td:first-child{ text-align:left; position:sticky; left:0; background:var(--surface); }
  thead th{
    color:var(--text-muted); font-weight:700; font-size:0.78rem; cursor:pointer; user-select:none;
    border-bottom:1px solid var(--border); background:var(--surface-2);
    /* A label carrying a newline renders as two lines. Bottom alignment keeps the
       one-line headers sitting level with the second line of the split ones. */
    vertical-align:bottom;
  }
  thead th:first-child{ background:var(--surface-2); }
  thead th:hover{ color:var(--text); }
  thead th[data-sorted]{ color:var(--accent); }
  thead th[data-sorted]::after{ content:" \25B2"; font-size:0.7em; }
  thead th[data-sorted="desc"]::after{ content:" \25BC"; font-size:0.7em; }
  tbody tr + tr td{ border-top:1px solid var(--border); }
  tbody tr:hover td{ background:var(--surface-2); }
  tbody tr:hover td:first-child{ background:var(--surface-2); }
  td.name{ color:var(--accent); font-weight:600; }
  td.zero{ color:var(--text-muted); }
  .num{ font-variant-numeric:tabular-nums; }

  .section-title{
    font-family:var(--font-mono); font-size:0.74rem; letter-spacing:0.09em; text-transform:uppercase;
    font-weight:700; color:var(--text-muted); margin:1.75rem 0 0.6rem;
  }
  .section-title:first-child{ margin-top:0; }

  .notice{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:1.25rem 1.4rem; color:var(--text-muted); font-size:0.93rem;
  }
  .notice code{ font-family:var(--font-mono); font-size:0.85rem; color:var(--text); }
  .notice ul{ margin:0.6rem 0 0; padding-left:1.2rem; }

  footer{ margin-top:3rem; border-top:1px solid var(--border); padding-top:1.25rem; color:var(--text-muted); font-size:0.82rem; }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="eyebrow">Earth Solo Only</div>
    <h1>Player Stats</h1>
    <p class="sub">Everything the server has recorded, per wipe and all time. Data comes from the Player Stats Logger plugin.</p>
    <p style="margin:0.9rem 0 0;"><a class="back" href="../index.html">&larr; Server change report</a></p>
  </header>

  <div class="controls">
    <input id="search" type="search" placeholder="Search player..." autocomplete="off">
    <select id="source"></select>
    <span class="count" id="count"></span>
  </div>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <div id="view"></div>

  <footer id="footer"></footer>
</div>

<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------------------
  // Data source.
  //
  // data.json is committed straight into this folder by the Player Stats Logger
  // plugin every few minutes, so nothing here is copied by hand. It carries every
  // set (this wipe, all time, and archived wipes later) in one file, which keeps
  // the upload to a single commit.
  // ---------------------------------------------------------------------------
  var DATA_FILE = "data.json";

  // ---------------------------------------------------------------------------
  // Tabs.
  //
  // A tab holds one or more sections, and a section is either a fixed list of
  // counter keys or a key prefix. Prefix sections build their columns from
  // whatever keys the data actually contains, so a stat added to the plugin
  // appears here on its own with no edit to this page.
  //
  // A tab written with columns/prefix at the top level is treated as a single
  // untitled section, which is the common case.
  // ---------------------------------------------------------------------------
  // Every trap on the death side. Feeds both the Killed By columns below and the
  // @trapdeaths total, so a new trap gets added in one place.
  var TRAP_DEATH_KEYS = [
    "killedby.guntrap", "killedby.landmine", "killedby.beartrap",
    "killedby.spikes.trap", "killedby.flameturret", "killedby.autoturret",
    "killedby.teslacoil", "killedby.spikes.floor", "killedby.barricade.metal",
    "killedby.barricade.wood", "killedby.barricade.woodwire", "killedby.samsite"
  ];

  var TABS = [
    // Ours, and first because the Coal Event is the point of this server. Coal Bought and
    // Coal Stored used to sit at the bottom of the Resources tab and were moved here rather
    // than shown twice, the same call as pulling the trap columns out of PVP.
    { id:"coal", label:"COAL", columns:[
      { key:"@hours",      label:"Hours\nPlayed", decimals:1 },
      { key:"coal.bought", label:"Coal\nBought" },
      { key:"coal.stored", label:"Coal\nStored" }
    ]},

    { id:"pvp", label:"PVP", columns:[
      { key:"@kdr",              label:"KDR", decimals:2 },
      { key:"pvp.kills",         label:"Kills" },
      { key:"pvp.deaths",        label:"Deaths" },
      { key:"pvp.suicides",      label:"Suicides" },
      { key:"pvp.wounded",       label:"Wounded" },
      { key:"pvp.recoveries",    label:"Wounded\nRecoveries" },
      { key:"med.syringe.medical", label:"Syringes\nUsed" },
      { key:"med.bandage",       label:"Bandages\nUsed" },
      { key:"med.largemedkit",   label:"Medkits\nUsed" },
      { key:"pvp.shots.fired",   label:"Shots\nFired" },
      { key:"pvp.shots.hit",     label:"Shots\nHit" },
      { key:"pvp.headshots",     label:"Headshots" },
      // Ours, from here on.
      { key:"pvp.deaths.player", label:"Deaths to\nPlayers" },
      { key:"@accuracy",         label:"Accuracy %", decimals:1 },
      { key:"pvp.headshots.kills",  label:"Headshot\nKills" },
      { key:"pvp.headshots.downed", label:"Headshot on\nDowned Player" },
      { key:"@hsdist",           label:"Average\nHeadshot/meter", decimals:1 }
    ]},

    // Ours. Traps are player-placed, so this is PVP, not PVE. Kills and deaths
    // are the same eleven traps twice, one section each.
    { id:"traps", label:"TRAPS", sections:[
      { title:"Kills", columns:[
        { key:"trap.kills",        label:"Trap\nKills" },
        { key:"trap.guntrap",      label:"Shotgun\nTrap" },
        { key:"trap.landmine",     label:"Landmine" },
        { key:"trap.beartrap",     label:"Bear\nTrap" },
        { key:"trap.spikes.trap",  label:"Spikes\nTrap" },
        { key:"trap.flameturret",  label:"Flame\nTurret" },
        { key:"trap.autoturret",   label:"Auto\nTurret" },
        { key:"trap.teslacoil",    label:"Tesla\nCoil" },
        { key:"trap.spikes.floor", label:"Floor\nSpikes" },
        { key:"trap.barricade.metal", label:"Metal\nBarricade" },
        { key:"trap.barricade.wood", label:"Wooden\nBarricade" },
        { key:"trap.barricade.woodwire", label:"Barbed\nBarricade" },
        { key:"trap.samsite",      label:"SAM\nSite" }
      ]},
      { title:"Killed By", columns:[
        { key:"@trapdeaths",           label:"Trap\nDeaths" },
        { key:"killedby.guntrap",      label:"Shotgun\nTrap" },
        { key:"killedby.landmine",     label:"Landmine" },
        { key:"killedby.beartrap",     label:"Bear\nTrap" },
        { key:"killedby.spikes.trap",  label:"Spikes\nTrap" },
        { key:"killedby.flameturret",  label:"Flame\nTurret" },
        { key:"killedby.autoturret",   label:"Auto\nTurret" },
        { key:"killedby.teslacoil",    label:"Tesla\nCoil" },
        { key:"killedby.spikes.floor", label:"Floor\nSpikes" },
        { key:"killedby.barricade.metal", label:"Metal\nBarricade" },
        { key:"killedby.barricade.wood", label:"Wooden\nBarricade" },
        { key:"killedby.barricade.woodwire", label:"Barbed\nBarricade" },
        { key:"killedby.samsite",      label:"SAM\nSite" }
      ]}
    ]},

    { id:"pve", label:"PVE", sections:[
      { title:"Killed", columns:[
        { key:"pve.scientist",     label:"Scientist" },
        { key:"pve.tunneldweller", label:"Tunnel Dweller" },
        { key:"pve.bear",          label:"Bear" },
        { key:"pve.polarbear",     label:"Polar Bear" },
        { key:"pve.boar",          label:"Boar" },
        { key:"pve.wolf",          label:"Wolf" },
        { key:"pve.stag",          label:"Stag" },
        { key:"pve.chicken",       label:"Chicken" },
        { key:"pve.horse",         label:"Horse" },
        { key:"pve.shark",         label:"Shark" },
        { key:"pve.crocodile",     label:"Crocodile" },
        { key:"pve.tiger",         label:"Tiger" },
        { key:"pve.panther",       label:"Panther" },
        { key:"pve.snake",         label:"Snake" },
        { key:"pve.bradley",       label:"Bradley APC" },
        { key:"vehicle.cars.shredded", label:"Cars Shredded" }
      ]},
      // Ours. Moose does not break deaths down by what killed you.
      // No Player column here, that is Deaths to Players on the PVP tab. No Patrol Heli
      // either, it is suppressed server-wide.
      { title:"Killed By", columns:[
        { key:"killedby.scientist",     label:"Scientist" },
        { key:"killedby.tunneldweller", label:"Tunnel Dweller" },
        { key:"killedby.bear",          label:"Bear" },
        { key:"killedby.polarbear",     label:"Polar Bear" },
        { key:"killedby.boar",          label:"Boar" },
        { key:"killedby.wolf",          label:"Wolf" },
        { key:"killedby.crocodile",     label:"Crocodile" },
        { key:"killedby.tiger",         label:"Tiger" },
        { key:"killedby.panther",       label:"Panther" },
        { key:"killedby.snake",         label:"Snake" },
        { key:"killedby.shark",         label:"Shark" },
        { key:"killedby.bradley",       label:"Bradley APC" },
        { key:"killedby.sentry", label:"Sentry" },
        { key:"killedby.fall",          label:"Fall" },
        { key:"killedby.drowned",       label:"Drowning" },
        { key:"killedby.cold",          label:"Cold" },
        { key:"killedby.heat",          label:"Heat" },
        { key:"killedby.hunger",        label:"Hunger" },
        { key:"killedby.thirst",        label:"Thirst" },
        { key:"killedby.radiation",     label:"Radiation" },
        { key:"killedby.bleeding",      label:"Bleeding" },
        { key:"killedby.self",          label:"Self" }
      ]}
    ]},

    { id:"resources", label:"Resources", columns:[
      { key:"gather.wood",         label:"Wood" },
      { key:"gather.stones",       label:"Stone" },
      { key:"gather.metal.ore",    label:"Metal Ore" },
      { key:"gather.sulfur.ore",   label:"Sulfur Ore" },
      { key:"gather.hq.metal.ore", label:"HQM Ore" },
      { key:"resource.diesel",     label:"Diesel Collected" }
      // Coal Bought and Coal Stored moved to the COAL tab. Not duplicated here.
    ]},

    { id:"building", label:"Building", columns:[
      // Boat Blocks Built dropped 9 August 2026: boats are permanently blocked on this
      // server, so building on a tugboat can never happen and the column could only read 0.
      { key:"build.blocks",      label:"Blocks Built" },
      { key:"build.upgraded",    label:"Blocks Upgraded" },
      { key:"build.demolished",  label:"Blocks Demolished" },
      { key:"build.used.hqm",    label:"HQM Used" },
      { key:"build.used.metal",  label:"Metal Used" },
      { key:"build.used.stone",  label:"Stone Used" },
      { key:"build.used.wood",   label:"Wood Used" }
    ]},

    { id:"farming", label:"Farming", columns:[
      // These come off the same gather counters as the Resources tab, because in
      // Rust hemp, animals and crops are all harvested through the same path.
      { key:"gather.cloth",          label:"Cloth" },
      { key:"gather.fat.animal",     label:"Animal Fat" },
      { key:"gather.leather",        label:"Leather" },
      { key:"gather.bone.fragments", label:"Bone Fragments" },
      { key:"gather.mushroom",       label:"Mushroom" },
      { key:"gather.pumpkin",        label:"Pumpkin" },
      { key:"gather.corn",           label:"Corn" },
      { key:"gather.wheat",          label:"Wheat" },
      { key:"gather.potato",         label:"Potato" },
      { key:"@berries",              label:"Berry" }
    ]},

    { id:"looting", label:"Looting", columns:[
      { key:"loot.crate",        label:"Loot Crate" },
      { key:"loot.barrel",       label:"Loot Barrel" },
      { key:"loot.oilcontainer", label:"Oil Container" },
      { key:"loot.elitecrate",   label:"Elite Crate" },
      { key:"loot.lockedcrate",  label:"Locked Crate" },
      { key:"loot.airdrop",      label:"Airdrop" },
      { key:"loot.bradleycrate", label:"Bradley Crate" },
      { key:"loot.helicrate",    label:"Heli Crate" },
      { key:"card.green",        label:"Green Card Uses" },
      { key:"card.blue",         label:"Blue Card Uses" },
      { key:"card.red",          label:"Red Card Uses" },
      // Ours. Every container opened, whatever type.
      { key:"loot.containers",   label:"Containers Opened" }
    ]},

    { id:"recycling", label:"Recycling", columns:[
      { key:"recycle.cycles",           label:"Recycler Cycles" },
      { key:"recycle.items",            label:"Total Items Recycled" },
      { key:"recycle.items.monument",   label:"Items Recycled (Monument)" },
      { key:"recycle.items.safezone",   label:"Items Recycled (Safe Zone)" },
      { key:"recycle.scrap",            label:"Scrap Produced" },
      { key:"recycle.hqm",              label:"HQM Produced" },
      { key:"recycle.metal",            label:"Metal Produced" },
      { key:"recycle.cloth",            label:"Cloth Produced" }
    ]},

    { id:"boom", label:"Boom", columns:[
      { key:"boom.rocket.basic",       label:"Rocket" },
      { key:"boom.rocket.hv",          label:"H.V. Rocket" },
      { key:"boom.rocket.incendiary",  label:"Incen. Rocket" },
      { key:"boom.explosive.ammo",     label:"Explo. Ammo" },
      { key:"boom.explosive.timed",    label:"C4" },
      { key:"boom.satchel",            label:"Satchel Charge" },
      { key:"boom.mlrs",               label:"MLRS" },
      { key:"boom.mortar.he",          label:"Mortar H.E." },
      { key:"boom.mortar.frag",        label:"Mortar Frag" },
      { key:"boom.40mm.he",            label:"40mm H.E." },
      { key:"boom.40mm.smoke",         label:"40mm Smoke" },
      { key:"boom.grenade.f1",         label:"F1 Grenade" },
      { key:"boom.grenade.beancan",    label:"Beancan Grenade" },
      { key:"boom.grenade.flash",      label:"Flashbang" },
      { key:"boom.grenade.smoke",      label:"Smoke" }
    ]},

    { id:"vehicles", label:"Vehicles", columns:[
      { key:"vehicle.fuel.used",              label:"Fuel Used" },
      { key:"vehicle.bought.minicopter",      label:"Minicopters Bought" },
      { key:"vehicle.bought.scraptransport",  label:"Scrap Helis Bought" },
      { key:"vehicle.bought.attackhelicopter", label:"Attack Helis Bought" },
      { key:"vehicle.bought.hab",             label:"HABs Bought" },
      { key:"vehicle.bought.rowboat",         label:"Boats Bought" },
      { key:"vehicle.bought.rhib",            label:"Rhibs Bought" },
      { key:"vehicle.bought.submarinesolo",   label:"Solo Subs Bought" },
      { key:"vehicle.bought.submarineduo",    label:"Duo Subs Bought" },
      { key:"vehicle.horse.claimed",          label:"Horse Claimed" }
    ]},

    { id:"vehiclecombat", label:"Vehicle Combat", columns:[
      { key:"heli.rockets.fired", label:"Attack Heli Rockets Fired" },
      { key:"heli.guns.fired",    label:"Attack Heli Guns Fired" },
      { key:"heli.flares.used",   label:"Attack Heli Flares Used" },
      { key:"heli.kills",         label:"Attack Heli Kills" },
      { key:"sub.torpedos.fired", label:"Submarine Torpedos Fired" },
      { key:"sub.kills",          label:"Submarine Kills" }
    ]},

    { id:"fishing", label:"Fishing", columns:[
      { key:"@catchrate",       label:"Catch %", decimals:2 },
      { key:"fish.casts",       label:"Casts" },
      { key:"fish.caught",      label:"Fishes Caught" },
      { key:"fish.catfish",     label:"Catfish" },
      { key:"fish.orangeroughy", label:"Orange Roughy" },
      { key:"fish.salmon",      label:"Salmon" },
      { key:"fish.smallshark",  label:"Small Shark" },
      { key:"fish.smalltrout",  label:"Small Trout" },
      { key:"fish.yellowperch", label:"Yellow Perch" },
      { key:"fish.anchovy",     label:"Anchovy" },
      { key:"fish.herring",     label:"Herring" },
      { key:"fish.sardine",     label:"Sardine" },
      { key:"fish.junk",        label:"Junk" }
    ]}
  ];

  var state = {
    payload: null,
    sourceId: "current",
    tabId: "coal",
    search: "",
    // Sort is per section, keyed "<tab id>|<section index>", so two tables on the
    // same tab sort independently.
    sort: {}
  };

  var el = {
    search: document.getElementById("search"),
    source: document.getElementById("source"),
    count:  document.getElementById("count"),
    tabs:   document.getElementById("tabs"),
    view:   document.getElementById("view"),
    footer: document.getElementById("footer")
  };

  // --- helpers ---------------------------------------------------------------

  function counter(player, key){
    var c = player.counters || {};
    return typeof c[key] === "number" ? c[key] : 0;
  }

  // Derived columns, the ones that are a calculation rather than a stored number.
  function derived(player, key){
    // Playtime is a top-level field rather than a counter, because it is seconds banked
    // rather than a count of events. Pulled through here so a tab can list it as a column
    // and sort on it like any other number.
    if (key === "@hours") return typeof player.hours === "number" ? player.hours : 0;
    // Player versus player only. Deaths to animals, falls and the kill command are
    // still deaths, they just do not belong in a player-versus-player ratio.
    if (key === "@kdr"){
      var k = counter(player, "pvp.kills"), d = counter(player, "pvp.deaths.player");
      return d === 0 ? k : k / d;
    }
    if (key === "@accuracy"){
      var fired = counter(player, "pvp.shots.fired");
      return fired === 0 ? 0 : counter(player, "pvp.shots.hit") * 100 / fired;
    }
    // Distance is recorded on headshot kills only, so the average is over those.
    // Rust has six berry colours and Moose shows one number, so they are summed.
    if (key === "@berries"){
      var counters = player.counters || {}, total = 0;
      Object.keys(counters).forEach(function(k){
        if (k.indexOf("gather.") === 0 && k.indexOf("berry") !== -1) total += counters[k];
      });
      return total;
    }
    // The kill side has a real trap.kills total from the plugin. The death side has
    // no such counter, so it is summed here from the same eleven traps.
    if (key === "@trapdeaths"){
      var total = 0;
      TRAP_DEATH_KEYS.forEach(function(k){ total += counter(player, k); });
      return total;
    }
    if (key === "@catchrate"){
      var casts = counter(player, "fish.casts");
      return casts === 0 ? 0 : counter(player, "fish.caught") / casts;
    }
    if (key === "@hsdist"){
      var hsKills = counter(player, "pvp.headshots.kills");
      return hsKills === 0 ? 0 : (counter(player, "pvp.headshots.distance.cm") / 100) / hsKills;
    }
    return counter(player, key);
  }

  function value(player, key){
    return key.charAt(0) === "@" ? derived(player, key) : counter(player, key);
  }

  function format(n, decimals){
    if (decimals) return n.toLocaleString(undefined, { minimumFractionDigits:decimals, maximumFractionDigits:decimals });
    return Math.round(n).toLocaleString();
  }

  // --- loading ---------------------------------------------------------------

  function load(){
    return fetch(DATA_FILE, { cache:"no-store" }).then(function(res){
      if (!res.ok) throw new Error(res.status + " " + res.statusText);
      return res.json();
    }).then(function(data){
      state.payload = data;
    }).catch(function(err){
      state.payload = { error: err.message };
    });
  }

  function currentSet(){
    var sets = (state.payload && state.payload.sets) || [];
    return sets.filter(function(s){ return s.id === state.sourceId; })[0] || sets[0] || null;
  }

  // --- rendering -------------------------------------------------------------

  function currentTab(){
    return TABS.filter(function(t){ return t.id === state.tabId; })[0];
  }

  function sectionsFor(tab){
    return tab.sections || [ { columns: tab.columns } ];
  }

  function render(){
    var payload = state.payload;
    if (!payload){ el.view.innerHTML = '<div class="notice">Loading...</div>'; return; }

    if (payload.error){
      el.view.innerHTML = '<div class="notice"><strong>No data yet.</strong>'
        + '<p style="margin:0.6rem 0 0;">This page reads <code>data.json</code>, which the Player Stats Logger plugin '
        + 'commits into this folder on a timer. If it is missing, the upload has not run yet or the plugin has no '
        + 'GitHub token set.</p>'
        + '<p style="margin:0.6rem 0 0;">Error: <code>' + escapeHtml(payload.error) + '</code></p></div>';
      el.count.textContent = "";
      el.footer.textContent = "";
      return;
    }

    var set = currentSet();
    if (!set){ el.view.innerHTML = '<div class="notice">The data file has no player sets in it.</div>'; return; }

    var players = Object.keys(set.players || {}).map(function(steamId){
      var p = set.players[steamId];
      p.SteamId = steamId;
      p.Name = p.name || steamId;
      return p;
    });

    var tab = currentTab();
    var sections = sectionsFor(tab);

    var needle = state.search.trim().toLowerCase();
    var visible = needle
      ? players.filter(function(p){ return p.Name.toLowerCase().indexOf(needle) !== -1; })
      : players;

    el.count.textContent = visible.length + (visible.length === 1 ? " player" : " players");

    var html = "";

    sections.forEach(function(section, index){
      var columns = section.columns;
      var sortId = tab.id + "|" + index;

      if (section.title) html += '<h2 class="section-title">' + escapeHtml(section.title) + '</h2>';

      // Default sort is the first column, biggest first. Names sort alphabetically.
      var sort = state.sort[sortId] || { key: columns[0].key, dir: "desc" };
      var dir = sort.dir === "asc" ? 1 : -1;

      var rows = visible.slice().sort(function(a, b){
        if (sort.key === "@name") return a.Name.localeCompare(b.Name) * dir;
        return (value(a, sort.key) - value(b, sort.key)) * dir;
      });

      html += '<div class="table-scroll"><table data-sort-id="' + sortId + '"><thead><tr>';
      html += '<th data-key="@name"' + (sort.key === "@name" ? ' data-sorted="' + sort.dir + '"' : '') + '>Player</th>';
      columns.forEach(function(col){
        html += '<th data-key="' + col.key + '"'
             + (sort.key === col.key ? ' data-sorted="' + sort.dir + '"' : '')
             + '>' + headerLabel(col.label) + '</th>';
      });
      html += '</tr></thead><tbody>';

      rows.forEach(function(p){
        html += '<tr><td class="name">' + escapeHtml(p.Name) + '</td>';
        columns.forEach(function(col){
          var n = value(p, col.key);
          html += '<td class="num' + (n ? '' : ' zero') + '">' + format(n, col.decimals) + '</td>';
        });
        html += '</tr>';
      });

      html += '</tbody></table></div>';
    });

    el.view.innerHTML = html;

    Array.prototype.forEach.call(el.view.querySelectorAll("th"), function(th){
      th.addEventListener("click", function(){
        var sortId = th.closest("table").getAttribute("data-sort-id");
        var key = th.getAttribute("data-key");
        var sort = state.sort[sortId];

        if (sort && sort.key === key){
          sort.dir = sort.dir === "desc" ? "asc" : "desc";
        } else {
          state.sort[sortId] = { key: key, dir: key === "@name" ? "asc" : "desc" };
        }
        render();
      });
    });

    var parts = [];

    if (state.sourceId === "alltime"){
      parts.push("All-time totals across every wipe.");
    } else {
      var started = payload.wipeStarted ? new Date(payload.wipeStarted) : null;
      if (started && !isNaN(started)) parts.push("Wipe started " + started.toLocaleString() + ".");
    }

    var generated = payload.generated ? new Date(payload.generated) : null;
    if (generated && !isNaN(generated)) parts.push("Updated " + generated.toLocaleString() + ".");

    el.footer.textContent = parts.join(" ");
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  // A column label may carry a newline to break the header onto a second line and
  // keep the table narrower. Escape first, then turn the newline into a break, so
  // the label itself still cannot inject markup.
  function headerLabel(s){
    return escapeHtml(s).replace(/\n/g, "<br>");
  }

  function renderTabs(){
    el.tabs.innerHTML = TABS.map(function(tab){
      return '<button role="tab" data-id="' + tab.id + '" aria-selected="'
        + (tab.id === state.tabId) + '">' + tab.label + '</button>';
    }).join("");

    Array.prototype.forEach.call(el.tabs.querySelectorAll("button"), function(button){
      button.addEventListener("click", function(){
        state.tabId = button.getAttribute("data-id");
        renderTabs();
        render();
      });
    });
  }

  function renderSources(){
    var sets = (state.payload && state.payload.sets) || [];
    el.source.innerHTML = sets.map(function(s){
      return '<option value="' + s.id + '"' + (s.id === state.sourceId ? " selected" : "")
        + '>' + escapeHtml(s.label || s.id) + '</option>';
    }).join("");
  }

  // --- wiring ----------------------------------------------------------------

  el.search.addEventListener("input", function(){
    state.search = el.search.value;
    render();
  });

  el.source.addEventListener("change", function(){
    state.sourceId = el.source.value;
    render();
  });

  renderTabs();
  el.view.innerHTML = '<div class="notice">Loading...</div>';

  load().then(function(){
    renderSources();
    render();
  });

})();
</script>
</body>
</html>
